name: Container build baseline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          submodules: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Select released digest or build candidate once
        run: |
          mkdir -p artifacts
          image=$(python3 -c 'import json; print(json.load(open("tools/container-lock.json"))["image"] or "")')
          if [[ -n "$image" ]]; then
            python3 tools/dev.py image pull "$image" 2>&1 | tee artifacts/image.log
          else
            python3 tools/dev.py image build 2>&1 | tee artifacts/image.log
          fi
          cp config/local/container-image.json artifacts/container-image.json
      - name: Check source formatting and Python lint offline
        run: python3 tools/dev.py --offline format --check
      - name: Install hash-locked asset business dependency
        run: python3 tools/dev.py assets setup
      - name: Verify development command behavior offline
        run: python3 tools/dev.py --offline test --suite tools
      - name: Verify synthetic assets with the upstream packer and GIF decoder offline
        run: python3 tools/dev.py --offline assets test
      - name: Verify C11 and C++17 host compilers offline
        run: python3 tools/dev.py --offline build --target host
      - name: Verify locked Xiaozhi source offline
        run: python3 tools/dev.py --offline xiaozhi check
      - name: Build Xiaozhi ESP32-S3 LCD reference with locked dependencies
        run: python3 tools/dev.py --jobs 4 xiaozhi build --profile reference-s3-lcd 2>&1 | tee artifacts/xiaozhi.log
      - name: Verify role behavior with the real upstream FSM, LVGL and GIF player offline
        run: python3 tools/dev.py --offline xiaozhi test 2>&1 | tee artifacts/role-tests.log
      - name: Compile isolated role UI using reference resources offline
        run: python3 tools/dev.py --offline --jobs 4 xiaozhi build --profile reference-s3-lcd --pet --assets build/container/xiaozhi-reference-s3-lcd/generated_assets.bin 2>&1 | tee artifacts/role-build.log
      - name: Compile XIAO Plus isolated display test offline
        run: python3 tools/dev.py --offline --jobs 4 xiaozhi build --profile xiao-esp32s3-plus-st7789 --display-test 2>&1 | tee artifacts/xiao-display-test.log
      - name: Compile XIAO Plus role integration with reference resources offline
        run: python3 tools/dev.py --offline --jobs 4 xiaozhi build --profile xiao-esp32s3-plus-st7789 --pet --assets build/container/xiaozhi-reference-s3-lcd/generated_assets.bin 2>&1 | tee artifacts/xiao-role-build.log
      - name: Build ESP32-S3 without assumed board peripherals offline
        run: python3 tools/dev.py --offline --jobs 4 build --target esp32s3 --board bringup 2>&1 | tee artifacts/firmware.log
      - name: Collect XIAO display-test flashing files
        run: |
          python3 - <<'PY'
          import json
          import shutil
          from pathlib import Path
          for build in Path("build/container/xiaozhi-pet").glob("*/build"):
              config = build / "sdkconfig"
              if config.exists() and "CONFIG_DC_DISPLAY_TEST=y" in config.read_text():
                  target = Path("artifacts/xiao-display-test")
                  metadata = json.loads((build / "flasher_args.json").read_text())
                  for name in ["flash_args", "flasher_args.json", "sdkconfig", *metadata["flash_files"].values()]:
                      output = target / name
                      output.parent.mkdir(parents=True, exist_ok=True)
                      shutil.copyfile(build / name, output)
          PY
      - name: Retain XIAO test firmware without character assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xiao-display-test
          path: artifacts/xiao-display-test/
          if-no-files-found: error
      - name: Retain build and image evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: esp32s3-container-bringup
          if-no-files-found: warn
          path: |
            artifacts/*
            tools/*lock.json
            tools/requirements-*.txt
            config/xiaozhi/*
            build/container/pet-tests/Testing/Temporary/LastTest.log
            build/container/xiaozhi-reference-s3-lcd/xiaozhi.bin
            build/container/xiaozhi-reference-s3-lcd/xiaozhi.elf
            build/container/xiaozhi-reference-s3-lcd/xiaozhi.map
            build/container/xiaozhi-reference-s3-lcd/bootloader/bootloader.bin
            build/container/xiaozhi-reference-s3-lcd/partition_table/partition-table.bin
            build/container/xiaozhi-reference-s3-lcd/generated_assets.bin
            build/container/xiaozhi-reference-s3-lcd/ota_data_initial.bin
            build/container/xiaozhi-reference-s3-lcd/flasher_args.json
            build/container/xiaozhi-reference-s3-lcd/sdkconfig
            build/container/esp32s3-bringup/deepchat.bin
            build/container/esp32s3-bringup/deepchat.elf
            build/container/esp32s3-bringup/deepchat.map
            build/container/esp32s3-bringup/bootloader/bootloader.bin
            build/container/esp32s3-bringup/partition_table/partition-table.bin
            build/container/esp32s3-bringup/flasher_args.json
            build/container/esp32s3-bringup/project_description.json
            build/container/esp32s3-bringup/sdkconfig
            build/container/esp32s3-bringup/compile_commands.json
