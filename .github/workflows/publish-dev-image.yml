name: Publish development image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    # Only an explicitly dispatched, reviewed main revision can publish.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build and validate the exact candidate
        run: |
          python3 tools/dev.py image build
          python3 tools/dev.py --offline format --check
          python3 tools/dev.py --offline test --suite tools
          python3 tools/dev.py --offline build --target host
          python3 tools/dev.py --offline --jobs 4 build --target esp32s3 --board bringup
      - name: Publish validated image and propose digest lock
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image_id=$(python3 -c 'import json; print(json.load(open("config/local/container-image.json"))["image"])')
          recipe=$(python3 -c 'import json; print(json.load(open("config/local/container-image.json"))["recipe"])')
          image="ghcr.io/${GITHUB_REPOSITORY,,}-dev:recipe-$recipe"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker tag "$image_id" "$image"
          docker push "$image"
          digest=$(docker image inspect "$image" --format '{{index .RepoDigests 0}}')
          python3 tools/dev.py image pin "$digest"
          printf '## Development image\n\n`%s`\n\nRecipe: `%s`\n\nReview the attached container-lock.json in a follow-up PR.\n' "$digest" "$recipe" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: released-container-lock
          path: tools/container-lock.json
